_format_version: "3.0"
services:
  - name: carrito-service
    url: http://carrito:3000
    routes:
      - name: carrito-route
        paths: ["/api/carrito"]
        strip_path: false
    plugins:
      - name: cors
        config:
          origins: ["http://localhost:5173"]
          methods: [GET, POST, PUT, DELETE, OPTIONS]
          headers: [Authorization, Content-Type]