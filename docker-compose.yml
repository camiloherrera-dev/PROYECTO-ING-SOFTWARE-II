services:
  redis:
    image: redis:7-alpine
    container_name: carrito_redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: carrito_postgres
    environment:
      POSTGRES_USER: carrito
      POSTGRES_PASSWORD: carrito_dev
      POSTGRES_DB: carrito
    # Si el 5432 de tu computador está ocupado, usa "5433:5432" y el puerto 5433 en tu DATABASE_URL local
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrito -d carrito"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-mock:
    build: ./mocks/catalog-mock
    container_name: carrito_catalog_mock
    ports: ["4000:4000"]

  # Imagen de producción. docker-compose.override.yml la cambia a desarrollo (nodemon y código montado);
  # para probar producción: docker compose -f docker-compose.yml up --build
  carrito:
    build:
      context: .
      target: prod
    container_name: carrito_api
    ports: ["3000:3000"]
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      CATALOG_BASE_URL: http://catalog-mock:4000/api/catalogo
      DATABASE_URL: postgres://carrito:carrito_dev@postgres:5432/carrito
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      catalog-mock: { condition: service_started }
    restart: unless-stopped

  kong:
    image: kong:3.7
    container_name: carrito_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong:/kong:ro
    ports: ["8000:8000", "8001:8001"]
    depends_on: [carrito]

volumes:
  pgdata:
